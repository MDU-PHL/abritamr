site_name: abritamr
site_url: https://mduphl.github.io/abritamr/

nav:
  - About: index.md
  - Installation: installation.md
  - Cookbook:
      - How do I?: cookbook/how_to.md
      - Troubleshooting: cookbook/faq.md
  - Usage:
      - V2 guide:
          - Overview: v2/index.md
          - Full workflow: v2/workflow.md
          - Commands:
              - scan: v2/commands/scan.md
              - amr_status: v2/commands/amr_status.md
              - linelist: v2/commands/linelist.md
              - matrix: v2/commands/matrix.md
              - infer: v2/commands/infer.md
          - Catalog and rules: v2/catalog-and-rules.md
      - Quick guide: usage/quickguide.md
      - Inputs: usage/inputs.md
      - Species detection: usage/species.md
      - Outputs: usage/outputs.md
  
  
#   - Contributing: contributing.md
  - License: license.md
theme:
  name: material
  logo: images/logo.svg
  palette:
      primary: blue grey
  icon:
      repo: fontawesome/brands/github-alt
  
features:
    - content.code.copy
    - content.code.select

repo_url: https://github.com/MDU-PHL/abritamr
repo_name: MDU-PHL/abritamr
extra:
  social:
    - icon: fontawesome/brands/github 
      link: https://github.com/MDU-PHL/abritamr

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format